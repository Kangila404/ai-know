name: Server release EC2
on:
  workflow_run:
    workflows: [Server CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: server-production-release
  cancel-in-progress: false

jobs:
  publish:
    if: vars.DEPLOY_TARGET == 'ec2' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.image.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
        run: |
          [[ "$DOCKERHUB_USERNAME" =~ ^[a-z0-9][a-z0-9_-]*$ ]] || { echo 'Set DOCKERHUB_USERNAME to your Docker Hub namespace.' >&2; exit 1; }
          revision=$(git rev-parse HEAD)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "image=docker.io/$DOCKERHUB_USERNAME/aiknow-server:$revision" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: ${{ steps.image.outputs.image }}

  deploy:
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.revision }}
      - name: Set up SSH without disabling host verification
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh-keygen -y -P '' -f ~/.ssh/deploy_key > /dev/null
      - name: Transfer the verified release to EC2 and deploy
        env:
          DEPLOY_HOST: ${{ secrets.EC2_HOST }}
          DEPLOY_USER: ${{ secrets.EC2_USER }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          REVISION: ${{ needs.publish.outputs.revision }}
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]] || { echo 'DEPLOY_HOST must be a hostname or IPv4 address without scheme or port.' >&2; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z0-9_-]+$ ]] || { echo 'DEPLOY_USER contains an invalid character.' >&2; exit 1; }
          [[ "$DOCKERHUB_USERNAME" =~ ^[a-z0-9][a-z0-9_-]*$ ]] || { echo 'DOCKERHUB_USERNAME is invalid.' >&2; exit 1; }
          # Build locally instead of passing a secret-containing image name through job outputs.
          IMAGE="docker.io/$DOCKERHUB_USERNAME/aiknow-server:$REVISION"
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ && "$IMAGE" =~ ^docker\.io/[a-z0-9][a-z0-9_-]*/aiknow-server:([a-f0-9]{40})$ ]] || { echo 'Release revision or image tag is invalid.' >&2; exit 1; }
          [[ "${IMAGE##*:}" == "$REVISION" ]] || { echo 'Image tag does not match the release revision.' >&2; exit 1; }
          opts=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          echo 'Checking EC2 deployment prerequisites through SSH...'
          cat infra/docker-command.sh infra/check-deploy-host.sh | ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'AIKNOW_DOCKER_SUDO=true sh -s'
          echo 'Transferring release files...'
          # Expand the validated local revision/image into the remote command intentionally.
          # shellcheck disable=SC2029
          git archive --format=tar "$REVISION" | ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p /opt/aiknow/releases/$REVISION && tar -xf - -C /opt/aiknow/releases/$REVISION"
          echo 'Starting the EC2 deployment script...'
          ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "AIKNOW_DOCKER_SUDO=true sh /opt/aiknow/releases/$REVISION/infra/deploy-server.sh /opt/aiknow/infra.env '$IMAGE'"

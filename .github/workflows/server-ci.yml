name: Server CI
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: server-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.changed.outputs.server }}
      workflow: ${{ steps.changed.outputs.workflow }}
      infra: ${{ steps.changed.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/changed-components.mjs "$BASE_SHA" "$HEAD_SHA"

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-ephemeral-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-ephemeral-only"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - run: chmod +x server/gradlew
      - run: ./gradlew clean build
        working-directory: server
        env:
          AIKNOW_MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:3306/mysql?allowPublicKeyRetrieval=true&useSSL=false
          AIKNOW_MYSQL_TEST_USER: root
          AIKNOW_MYSQL_TEST_PASSWORD: ci-ephemeral-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-test-results
          path: server/build/reports/tests/

  workflow:
    needs: changes
    if: needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test infra/n8n/*.test.mjs scripts/*.test.mjs

  infrastructure:
    needs: changes
    if: needs.changes.outputs.infra == 'true' || needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-infra.mjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: false
          tags: aiknow-server:ci

  required:
    if: always()
    needs: [changes, server, workflow, infrastructure]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const n=JSON.parse(process.env.RESULTS);if(Object.values(n).some(j=>!["success","skipped"].includes(j.result)))process.exit(1)'


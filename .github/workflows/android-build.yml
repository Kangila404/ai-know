name: Android build
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android-build.yml']
  push:
    branches: [main, develop]
    paths: ['android/**', '.github/workflows/android-build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build native app, unit tests and lint
        working-directory: android
        run: bash gradlew :app:assembleDemoDebug :app:assembleLiveDebug :app:testLiveDebugUnitTest :app:lintLiveDebug
      - uses: actions/upload-artifact@v4
        with:
          name: aiknow-android-debug
          path: |
            android/app/build/outputs/apk/demo/debug/*.apk
            android/app/build/outputs/apk/live/debug/*.apk
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-liveDebug.html

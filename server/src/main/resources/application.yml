spring:
  application:
    name: ai-know

  jpa:
    open-in-view: false
  flyway:
    enabled: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: ${BATCH_SCHEMA_INIT:embedded}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${GOOGLE_REDIRECT_URI}
            scope:
              - openid
              - profile

server:
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: JSESSIONID
        http-only: true
        secure: true
        same-site: lax

app:
  social:
    providers:
      google:
        enabled: ${GOOGLE_NATIVE_LOGIN_ENABLED:false}
        audiences: ${GOOGLE_NATIVE_CLIENT_IDS:}
      kakao:
        enabled: ${KAKAO_LOGIN_ENABLED:false}
        audiences: ${KAKAO_CLIENT_IDS:}
      apple:
        enabled: ${APPLE_LOGIN_ENABLED:false}
        audiences: ${APPLE_CLIENT_IDS:}
  media:
    mode: ${MEDIA_STORAGE_MODE:mounted}
    enabled: ${MEDIA_STORAGE_ENABLED:false}
    root: ${MEDIA_ROOT:}
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:}
    volume-id: ${MEDIA_VOLUME_ID:}
  ingestion:
    token: ${N8N_INGEST_TOKEN:}
  news-delivery:
    enabled: ${NEWS_BATCH_ENABLED:false}
    zone: ${NEWS_TIME_ZONE:Asia/Seoul}
    cron: ${NEWS_BATCH_CRON:0 * * * * *}
    page-size: ${NEWS_BATCH_PAGE_SIZE:100}
    max-attempts: ${NEWS_MAX_ATTEMPTS:5}
    lease: ${NEWS_DELIVERY_LEASE:PT5M}
    fcm-enabled: ${FCM_ENABLED:false}
    credentials-path: ${FCM_CREDENTIALS_PATH:}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}

  login-success-url: ${LOGIN_SUCCESS_URL:/api/v1/users}
